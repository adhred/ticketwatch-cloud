# See config.example.toml for all options.
city = "hyderabad"
bms_region_code = "HYD"   # BookMyShow city code; skips a lookup request
check_every_minutes = 1

[notify]
mac = true   # phone alerts are in secrets.toml (Telegram)

# Only PCX (Prasads) and Dolby Cinema (Allu) screens. Every new show on those screens,
# a new date or an added showtime, alerts once. Checks stop by themselves after the last date.

[[watch]]
name = "PCX / Dolby Cinema"
priority = "high"
movie = "Avengers: Doomsday"
languages = ["English"]
formats = ["PCX", "Dolby Cinema"]   # PCX is at Prasads, Dolby Cinema at Allu
dates = ["2026-12-17", "2026-12-18", "2026-12-19", "2026-12-20", "2026-12-21"]
theatres = ["bms:PRHN", "bms:ALUC"]   # Prasads Multiplex, ALLU Cinemas Kokapet
